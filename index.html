<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FGO Command Card Calculator</title>
    <style>
        :root {
            --bg-color: #1a1a2e;
            --panel-bg: #16213e;
            --text-color: #e9e9e9;
            --accent: #e94560;
            --border: #0f3460;
        }
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            margin: 0;
            padding: 20px;
            display: flex;
            justify-content: center;
        }
        .container {
            background-color: var(--panel-bg);
            padding: 25px;
            border-radius: 12px;
            box-shadow: 0 8px 16px rgba(0,0,0,0.5);
            max-width: 600px;
            width: 100%;
            border: 2px solid var(--border);
        }
        h1 {
            text-align: center;
            margin-top: 0;
            color: var(--accent);
            font-size: 24px;
        }
        .form-group {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 15px;
            flex-wrap: wrap;
        }
        .form-group label {
            flex: 1;
            min-width: 200px;
            font-weight: 600;
        }
        .form-group input[type="number"],
        .form-group select {
            flex: 1;
            min-width: 150px;
            padding: 8px;
            border-radius: 6px;
            border: 1px solid var(--border);
            background-color: #24305e;
            color: white;
            font-size: 14px;
        }
        .form-group input[type="checkbox"] {
            transform: scale(1.3);
            margin-left: 10px;
        }
        .checkbox-group {
            display: flex;
            gap: 20px;
            margin-top: 10px;
            margin-bottom: 20px;
            padding: 15px;
            background: rgba(0,0,0,0.2);
            border-radius: 8px;
            flex-wrap: wrap;
        }
        .checkbox-item {
            display: flex;
            align-items: center;
            gap: 8px;
        }
        .results {
            margin-top: 25px;
            padding: 20px;
            background: linear-gradient(135deg, #0f3460, #16213e);
            border-radius: 8px;
            text-align: center;
            border: 1px solid var(--accent);
        }
        .results h2 {
            margin: 0 0 15px 0;
            font-size: 20px;
            color: #fff;
        }
        .damage-numbers {
            display: flex;
            justify-content: space-around;
        }
        .dmg-box {
            display: flex;
            flex-direction: column;
        }
        .dmg-label {
            font-size: 14px;
            color: #aaa;
            margin-bottom: 5px;
        }
        .dmg-value {
            font-size: 24px;
            font-weight: bold;
        }
        .dmg-avg { color: #f1c40f; font-size: 28px; }
        .dmg-min { color: #3498db; }
        .dmg-max { color: #e74c3c; }
        
        hr { border: 1px solid var(--border); margin: 20px 0; }
    </style>
</head>
<body>

<div class="container">
    <h1>Command Card Damage Calc</h1>

    <div class="form-group">
        <label for="atk">Servant ATK (Total):</label>
        <input type="number" id="atk" value="10000" min="0">
    </div>

    <div class="form-group">
        <label for="cardType">Card Type:</label>
        <select id="cardType">
            <option value="Buster">Buster</option>
            <option value="Arts">Arts</option>
            <option value="Quick">Quick</option>
        </select>
    </div>

    <div class="form-group">
        <label for="position">Card Position:</label>
        <select id="position">
            <option value="1.0">1st Card</option>
            <option value="1.2">2nd Card</option>
            <option value="1.4">3rd Card</option>
        </select>
    </div>

    <div class="form-group">
        <label for="classAffinity">Class Advantage:</label>
        <select id="classAffinity">
            <option value="2.0">Advantage (2.0x)</option>
            <option value="1.5">Berserker/Pretender Adv (1.5x)</option>
            <option value="1.0" selected>Neutral (1.0x)</option>
            <option value="0.5">Disadvantage (0.5x)</option>
        </select>
    </div>

    <div class="form-group">
        <label for="classAtk">Class ATK Multiplier:</label>
        <select id="classAtk">
            <option value="1.1">Berserker / Ruler / Avenger (1.1x)</option>
            <option value="1.05">Lancer (1.05x)</option>
            <option value="1.0" selected>Saber / Rider / Alter Ego / etc (1.0x)</option>
            <option value="0.95">Archer (0.95x)</option>
            <option value="0.9">Caster / Assassin (0.9x)</option>
        </select>
    </div>

    <div class="checkbox-group">
        <div class="checkbox-item">
            <input type="checkbox" id="firstBuster">
            <label for="firstBuster">First Card Buster Bonus</label>
        </div>
        <div class="checkbox-item">
            <input type="checkbox" id="busterChain">
            <label for="busterChain">Buster Chain Bonus</label>
        </div>
        <div class="checkbox-item">
            <input type="checkbox" id="isCrit">
            <label for="isCrit">Critical Hit</label>
        </div>
    </div>

    <hr>
    
    <div class="form-group">
        <label for="atkBuff">ATK Up / Def Down (%):</label>
        <input type="number" id="atkBuff" value="0">
    </div>
    
    <div class="form-group">
        <label for="cardBuff">Card Effectiveness Up (%):</label>
        <input type="number" id="cardBuff" value="0">
    </div>

    <div class="form-group">
        <label for="critBuff">Crit Damage Up (%):</label>
        <input type="number" id="critBuff" value="0">
    </div>

    <div class="form-group">
        <label for="powerMod">Special Damage / Power Mod (%):</label>
        <input type="number" id="powerMod" value="0">
    </div>

    <div class="form-group">
        <label for="flatDmg">Damage Plus (Flat):</label>
        <input type="number" id="flatDmg" value="0">
    </div>

    <div class="results">
        <h2>Expected Damage</h2>
        <div class="damage-numbers">
            <div class="dmg-box">
                <span class="dmg-label">Minimum</span>
                <span class="dmg-value dmg-min" id="minDmg">0</span>
            </div>
            <div class="dmg-box">
                <span class="dmg-label">Average</span>
                <span class="dmg-value dmg-avg" id="avgDmg">0</span>
            </div>
            <div class="dmg-box">
                <span class="dmg-label">Maximum</span>
                <span class="dmg-value dmg-max" id="maxDmg">0</span>
            </div>
        </div>
    </div>
</div>

<script>
    const inputs = document.querySelectorAll('input, select');
    
    inputs.forEach(input => {
        input.addEventListener('input', calculateDamage);
    });

    function calculateDamage() {
        let atk = parseFloat(document.getElementById('atk').value) || 0;
        let cardType = document.getElementById('cardType').value;
        let position = parseFloat(document.getElementById('position').value);
        let classAffinity = parseFloat(document.getElementById('classAffinity').value);
        let classAtk = parseFloat(document.getElementById('classAtk').value);
        
        let firstBuster = document.getElementById('firstBuster').checked;
        let busterChain = document.getElementById('busterChain').checked;
        let isCrit = document.getElementById('isCrit').checked;

        let atkBuff = (parseFloat(document.getElementById('atkBuff').value) || 0) / 100;
        let cardBuff = (parseFloat(document.getElementById('cardBuff').value) || 0) / 100;
        let critBuff = (parseFloat(document.getElementById('critBuff').value) || 0) / 100;
        let powerMod = (parseFloat(document.getElementById('powerMod').value) || 0) / 100;
        let flatDmg = parseFloat(document.getElementById('flatDmg').value) || 0;

        let cardMod = 1.0;
        if (cardType === 'Buster') cardMod = 1.5;
        if (cardType === 'Arts') cardMod = 1.0;
        if (cardType === 'Quick') cardMod = 0.8;

        let firstCardBonus = firstBuster ? 0.5 : 0;
        
        let busterChainBonus = (busterChain && cardType === 'Buster') ? (atk * 0.2) : 0;
        
        let critBaseMultiplier = isCrit ? 2.0 : 1.0;
        let activeCritBuff = isCrit ? critBuff : 0;
      
        let cardBlock = (cardMod * position * (1 + cardBuff)) + firstCardBonus;
        let statBlock = atk * 0.23 * cardBlock * classAtk * classAffinity;
        
        let attackMultiplier = Math.max(0, 1 + atkBuff);
        let powerCritMultiplier = Math.max(0, 1 + powerMod + activeCritBuff);

        let baseDamageBeforeRNG = statBlock * attackMultiplier * powerCritMultiplier * critBaseMultiplier;

        let minDmg = Math.floor(baseDamageBeforeRNG * 0.9) + busterChainBonus + flatDmg;
        let avgDmg = Math.floor(baseDamageBeforeRNG * 1.0) + busterChainBonus + flatDmg;
        let maxDmg = Math.floor(baseDamageBeforeRNG * 1.099) + busterChainBonus + flatDmg;

        document.getElementById('minDmg').innerText = Math.max(0, minDmg).toLocaleString();
        document.getElementById('avgDmg').innerText = Math.max(0, avgDmg).toLocaleString();
        document.getElementById('maxDmg').innerText = Math.max(0, maxDmg).toLocaleString();
    }

    calculateDamage();
</script>

</body>
</html>
